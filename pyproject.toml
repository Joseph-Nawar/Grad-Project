[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "rural-stroke-assist"
version = "0.0.1"
description = "Multimodal prehospital stroke-triage decision-support research prototype."
authors = [
  { name = "Joseph" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2,<3",
    "streamlit==1.39.0",
    "PyYAML==6.0.3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "PyJWT>=2.9,<3",
    "python-multipart>=0.0.9,<1",
    "boto3==1.43.67",
    "cryptography==45.0.7",
]


[tool.ruff]
line-length = 99
src = ["rural_stroke_assist", "tests"]
include = [
    "scripts/bootstrap_local.py",
    "scripts/clear_runtime_data.py",
    "scripts/check_release_readiness.py",
    "scripts/prepare_demo_state.py",
]

# Phase 5 validates its newly added release tooling without reformatting the
# functioning application, evaluation, and historical test modules.

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["rural_stroke_assist"]
force-sort-within-sections = true

[tool.pytest.ini_options]
markers = [
    "integration: loads selected model artifacts and validates cross-component contracts",
    "evaluation: runs Phase 4 evaluation code",
    "slow: may take longer than normal unit tests",
    "postgres: requires a real PostgreSQL test database via RURALSTROKE_DATABASE_URL",
]

