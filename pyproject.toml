[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "rural-stroke-assist"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Joseph" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2,<3",
]


[tool.ruff]
line-length = 99
src = ["rural_stroke_assist", "tests"]
include = ["pyproject.toml", "rural_stroke_assist/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["rural_stroke_assist"]
force-sort-within-sections = true

[tool.pytest.ini_options]
markers = [
    "integration: loads selected model artifacts and validates cross-component contracts",
]

