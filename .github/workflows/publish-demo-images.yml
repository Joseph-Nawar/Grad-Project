name: Publish Stage 3 demo images

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region containing the bootstrap ECR repositories
        required: true
        default: eu-central-1
        type: string
      api_repository:
        description: ECR repository name for the API image
        required: true
        default: ruralstroke-assist-api
        type: string
      ui_repository:
        description: ECR repository name for the UI image
        required: true
        default: ruralstroke-assist-ui
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest
    environment: stage3-demo
    outputs:
      api_image_digest: ${{ steps.digests.outputs.api_image_digest }}
      ui_image_digest: ${{ steps.digests.outputs.ui_image_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region || 'eu-central-1' }}
      - name: Resolve ECR registry
        id: registry
        env:
          AWS_REGION: ${{ inputs.aws_region || 'eu-central-1' }}
        run: echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
      - name: Login to ECR
        env:
          AWS_REGION: ${{ inputs.aws_region || 'eu-central-1' }}
          REGISTRY: ${{ steps.registry.outputs.registry }}
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Build exact API and UI images once
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          API_REPOSITORY: ${{ inputs.api_repository || 'ruralstroke-assist-api' }}
          UI_REPOSITORY: ${{ inputs.ui_repository || 'ruralstroke-assist-ui' }}
        run: |
          docker build --provenance=mode=max --sbom=true --target api --tag "$REGISTRY/$API_REPOSITORY:${GITHUB_SHA}" .
          docker build --provenance=mode=max --sbom=true --target ui --tag "$REGISTRY/$UI_REPOSITORY:${GITHUB_SHA}" .
      - name: Test exact images before push
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          API_REPOSITORY: ${{ inputs.api_repository || 'ruralstroke-assist-api' }}
          UI_REPOSITORY: ${{ inputs.ui_repository || 'ruralstroke-assist-ui' }}
        run: |
          test "$(docker image inspect "$REGISTRY/$API_REPOSITORY:${GITHUB_SHA}" --format '{{.Config.User}}')" = ruralstroke
          test "$(docker image inspect "$REGISTRY/$UI_REPOSITORY:${GITHUB_SHA}" --format '{{.Config.User}}')" = ruralstroke
          docker run --rm --entrypoint python "$REGISTRY/$UI_REPOSITORY:${GITHUB_SHA}" -c 'import streamlit'
      - name: Scan exact images
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          API_REPOSITORY: ${{ inputs.api_repository || 'ruralstroke-assist-api' }}
          UI_REPOSITORY: ${{ inputs.ui_repository || 'ruralstroke-assist-ui' }}
        run: |
          trivy_image='aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56'
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$trivy_image" image --exit-code 1 --ignore-unfixed --severity CRITICAL "$REGISTRY/$API_REPOSITORY:${GITHUB_SHA}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$trivy_image" image --exit-code 1 --ignore-unfixed --severity CRITICAL "$REGISTRY/$UI_REPOSITORY:${GITHUB_SHA}"
      - name: Push the tested image bytes
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          API_REPOSITORY: ${{ inputs.api_repository || 'ruralstroke-assist-api' }}
          UI_REPOSITORY: ${{ inputs.ui_repository || 'ruralstroke-assist-ui' }}
        run: |
          docker push "$REGISTRY/$API_REPOSITORY:${GITHUB_SHA}"
          docker push "$REGISTRY/$UI_REPOSITORY:${GITHUB_SHA}"
      - name: Record exact ECR digests
        id: digests
        env:
          AWS_REGION: ${{ inputs.aws_region || 'eu-central-1' }}
          API_REPOSITORY: ${{ inputs.api_repository || 'ruralstroke-assist-api' }}
          UI_REPOSITORY: ${{ inputs.ui_repository || 'ruralstroke-assist-ui' }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          api_digest=$(aws ecr describe-images --repository-name "$API_REPOSITORY" --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)
          ui_digest=$(aws ecr describe-images --repository-name "$UI_REPOSITORY" --image-ids imageTag="${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ui_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "api_image_digest=$account.dkr.ecr.${AWS_REGION}.amazonaws.com/$API_REPOSITORY@$api_digest" >> "$GITHUB_OUTPUT"
          echo "ui_image_digest=$account.dkr.ecr.${AWS_REGION}.amazonaws.com/$UI_REPOSITORY@$ui_digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Exact tested ECR images"
            echo "API: $account.dkr.ecr.${AWS_REGION}.amazonaws.com/$API_REPOSITORY@$api_digest"
            echo "UI: $account.dkr.ecr.${AWS_REGION}.amazonaws.com/$UI_REPOSITORY@$ui_digest"
          } >> "$GITHUB_STEP_SUMMARY"
