name: Deploy Stage 3 demo

on:
  workflow_dispatch:
    inputs:
      api_image_digest:
        description: Exact API ECR image reference passed by green CI
        required: true
        type: string
      ui_image_digest:
        description: Exact UI ECR image reference passed by green CI
        required: true
        type: string
      migration_task_definition:
        description: Terraform-created migration task definition ARN
        required: true
        type: string
      api_task_definition:
        description: Task definition revision rendered with the exact API digest
        required: true
        type: string
      collector_task_definition:
        description: Task definition revision rendered with the exact UI digest
        required: true
        type: string
      clinician_task_definition:
        description: Task definition revision rendered with the exact UI digest
        required: true
        type: string
      cluster:
        description: ECS cluster name
        required: true
        type: string
      private_subnets:
        description: Comma-separated private subnet IDs
        required: true
        type: string
      ecs_security_group:
        description: ECS task security group ID
        required: true
        type: string
      api_service:
        description: ECS API service name
        required: true
        type: string
      collector_service:
        description: ECS collector service name
        required: true
        type: string
      clinician_service:
        description: ECS clinician service name
        required: true
        type: string
      demo_host:
        description: HTTPS demo hostname
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stage3-demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3, verified release commit
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Enforce exact image digests
        env:
          API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
          UI_IMAGE_DIGEST: ${{ inputs.ui_image_digest }}
        run: |
          [[ "$API_IMAGE_DIGEST" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$UI_IMAGE_DIGEST" =~ @sha256:[0-9a-f]{64}$ ]]
      - name: Verify exact images in ECR
        env:
          API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
          UI_IMAGE_DIGEST: ${{ inputs.ui_image_digest }}
        run: |
          API_REPOSITORY="${API_IMAGE_DIGEST#*/}"; API_REPOSITORY="${API_REPOSITORY%%@*}"
          UI_REPOSITORY="${UI_IMAGE_DIGEST#*/}"; UI_REPOSITORY="${UI_REPOSITORY%%@*}"
          aws ecr describe-images --repository-name "$API_REPOSITORY" --image-ids imageDigest="${API_IMAGE_DIGEST##*@}"
          aws ecr describe-images --repository-name "$UI_REPOSITORY" --image-ids imageDigest="${UI_IMAGE_DIGEST##*@}"
      - name: Run one-off Alembic migration task
        id: migration
        env:
          CLUSTER: ${{ inputs.cluster }}
          TASK_DEFINITION: ${{ inputs.migration_task_definition }}
          SUBNETS: ${{ inputs.private_subnets }}
          SECURITY_GROUP: ${{ inputs.ecs_security_group }}
        run: |
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASK_DEFINITION" --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" --query 'tasks[0].taskArn' --output text)
          test "$TASK_ARN" != "None"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT_CODE" = "0"
      - name: Roll API/UI services by exact CI-approved revisions
        env:
          CLUSTER: ${{ inputs.cluster }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "${{ inputs.api_service }}" --task-definition "${{ inputs.api_task_definition }}"
          aws ecs update-service --cluster "$CLUSTER" --service "${{ inputs.collector_service }}" --task-definition "${{ inputs.collector_task_definition }}"
          aws ecs update-service --cluster "$CLUSTER" --service "${{ inputs.clinician_service }}" --task-definition "${{ inputs.clinician_task_definition }}"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "${{ inputs.api_service }}" "${{ inputs.collector_service }}" "${{ inputs.clinician_service }}"
      - name: HTTPS smoke checks
        run: |
          curl --fail --silent --show-error "https://${{ inputs.demo_host }}/health/ready"
          curl --fail --silent --show-error "https://${{ inputs.demo_host }}/collector/_stcore/health"
          curl --fail --silent --show-error "https://${{ inputs.demo_host }}/clinician/_stcore/health"
