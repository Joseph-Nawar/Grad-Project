name: CI

on:
  push:
  pull_request:

jobs:
  fast-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install constrained dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-baseline.txt -c constraints-baseline.txt
          python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Compile
        run: python -m compileall -q rural_stroke_assist apps scripts tests
      - name: Fast tests
        run: python -m pytest -m "not slow and not evaluation and not integration" -q
      - name: Release validation
        run: python scripts/check_release_readiness.py
