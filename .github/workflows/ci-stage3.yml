name: Stage 3 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-build-scan-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-baseline.txt -c constraints-baseline.txt
          python -m pip install -r requirements-dev.txt
      - name: Existing and Stage 3 Python tests
        run: python -m pytest -m "not slow and not evaluation" -q
      - name: Baseline and OpenAPI validation
        run: |
          python scripts/verify_baseline.py
          python scripts/check_release_readiness.py
          python scripts/generate_openapi.py --check
      - name: Terraform format and validation
        working-directory: infra/terraform/demo
        run: |
          terraform fmt -check -recursive ../
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate runtime artifact boundary
        run: |
          python scripts/inspect_stage3_runtime.py --output reports/production/stage3/ci-runtime-inventory.json
          test -f models/experiments/face/trial_003_mobilenetv2_balanced_160/model.keras
          test -f models/experiments/speech/trial_001_mfcc_random_forest/model.pkl
          test -f models/experiments/metadata/mvp_metadata_risk_model.pkl
      - name: Build API image with SBOM and provenance
        run: docker build --provenance=mode=max --sbom=true --target api --tag ruralstroke-api:ci .
      - name: Build UI image with SBOM and provenance
        run: docker build --provenance=mode=max --sbom=true --target ui --tag ruralstroke-ui:ci .
      - name: Inspect image boundary and non-root users
        run: |
          test "$(docker image inspect ruralstroke-api:ci --format '{{.Config.User}}')" = "ruralstroke"
          test "$(docker image inspect ruralstroke-ui:ci --format '{{.Config.User}}')" = "ruralstroke"
          test "$(docker run --rm --entrypoint python ruralstroke-ui:ci -c 'import os; print(os.path.exists("/app/models"))')" = "False"
      - name: Gate remediable CRITICAL image findings
        run: |
          trivy_image='aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56' # v0.58.2
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$trivy_image" image --exit-code 1 --ignore-unfixed --severity CRITICAL ruralstroke-api:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$trivy_image" image --exit-code 1 --ignore-unfixed --severity CRITICAL ruralstroke-ui:ci
      - name: Record HIGH and MEDIUM image findings
        continue-on-error: true
        run: |
          mkdir -p reports/production/stage3
          trivy_image='aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56' # v0.58.2
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports/production/stage3:/out" "$trivy_image" image --format json --output /out/trivy-api.json --severity HIGH,MEDIUM ruralstroke-api:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports/production/stage3:/out" "$trivy_image" image --format json --output /out/trivy-ui.json --severity HIGH,MEDIUM ruralstroke-ui:ci
      - name: Export image SBOMs
        run: |
          mkdir -p reports/production/stage3
          syft_image='anchore/syft@sha256:b8c170b8e51bfc4779ec3ef4399942c57290f5ce76a9c3af564c9d00d4946a6b'
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports/production/stage3:/out" "$syft_image" ruralstroke-api:ci -o cyclonedx-json=/out/sbom-api.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports/production/stage3:/out" "$syft_image" ruralstroke-ui:ci -o cyclonedx-json=/out/sbom-ui.json
      - name: Compose configuration and clean-stack E2E
        run: |
          python scripts/stack.py up
          python -m pytest tests/e2e/test_compose_workflow.py -q
          python scripts/stack.py reset
